---
services:
  mariadb:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # the image's entrypoint builds the database and both accounts from these on
    # first boot, so there is no command of our own
    environment:
      MYSQL_DATABASE: "{{ .Database }}"
      MYSQL_PASSWORD: "{{ .Secret.password }}"
      MYSQL_ROOT_PASSWORD: "{{ .Secret.root_password }}"
      MYSQL_USER: mariadb

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /etc/mysql/conf.d
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /var/lib/mysql

    configs:
      - source: disable_performance_schema
        target: /etc/mysql/conf.d/disable_performance_schema.cnf
      - source: charset_utf8
        target: /etc/mysql/conf.d/charset_utf8.cnf

    ports:
      - name: native
        target: 3306
        primary: true

configs:
  disable_performance_schema:
    content: |
      [mysqld]
      performance_schema = 0

  charset_utf8:
    content: |
      [mysqld]
      character-set-server = utf8mb4
      collation-server = utf8mb4_unicode_ci

x-dokku:
  plugin: mariadb
  title: MariaDB

  # mysql rather than mariadb: a linked app talks to it with a mysql driver, and
  # this is the scheme the bash plugin has always handed over
  scheme: mysql
  alias: DATABASE
  alt_alias: DOKKU_MARIADB

  dsn: "{{ .Scheme }}://mariadb:{{ .Secret.password }}@{{ .Host }}:{{ .Port.native }}/{{ .Database }}"
  wait: native

  secrets:
    password:
      file: PASSWORD
      length: 16
      env: SERVICE_PASSWORD
    root_password:
      file: ROOTPASSWORD
      length: 16
      env: SERVICE_ROOT_PASSWORD

  commands:
    # the password goes in MYSQL_PWD rather than on the command line, so it is
    # not in the container's process table. The bash plugin interpolates it into
    # a shell string instead, where a quote in a password ends the string.
    # --unbuffered flushes each result as it is printed: without a terminal,
    # as over ssh without -t, the client otherwise holds every result until it
    # exits.
    connect:
      exec: ["dokku-mariadb-client", "--user=mariadb", "--unbuffered", "--database={{ .Database }}"]
      env:
        MYSQL_PWD: "{{ .Secret.password }}"
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    export:
      extra_args: true
      exec: ["dokku-mariadb-dump", "--user=mariadb", "{{ .Database }}"]
      env:
        MYSQL_PWD: "{{ .Secret.password }}"

      # every database but the ones the server keeps for itself, whose
      # accounts and grants would otherwise be loaded over the target's. The
      # dump drops and makes each database again before loading it, under the
      # name it was exported from, so it is loaded without naming one.
      all_databases:
        extra_args: true
        exec:
          - bash
          - -c
          - |
            set -eo pipefail
            listing="$(dokku-mariadb-client --user=root -N -B -e "
              SELECT schema_name FROM information_schema.schemata
               WHERE schema_name NOT IN ('mysql', 'sys', 'information_schema', 'performance_schema')
               ORDER BY schema_name")"
            mapfile -t databases <<<"$listing"
            exec dokku-mariadb-dump "$@" --add-drop-database --databases "${databases[@]}"
          - dokku-mariadb-export-all
          - --user=root
          - --single-transaction
          - --quick
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"

    import:
      extra_args: true
      stdin: true
      exec: ["dokku-mariadb-client", "--user=mariadb", "{{ .Database }}"]
      env:
        MYSQL_PWD: "{{ .Secret.password }}"

      # a dump of every database names each one it loads, so none is named here
      all_databases:
        extra_args: true
        stdin: true
        exec: ["dokku-mariadb-client", "--user=root"]
        env:
          MYSQL_PWD: "{{ .Secret.root_password }}"

    # the database is dropped and made again with the character set and
    # collation it had, which takes the tables, views, routines, triggers and
    # events in it. Grants on the database are kept by name rather than with it,
    # so the account a linked app connects as keeps its access. Other sessions in
    # the database are ended first, as a transaction one holds open would leave
    # the drop waiting on its lock; lock_wait_timeout fails the drop rather than
    # leaving it waiting for a year should one start in between. Run as root
    # rather than as mariadb, which can only end its own sessions.
    #
    # the create statement is read before anything is dropped, so a database
    # that cannot be described is left alone. Written inline rather than shipped
    # as a script, since a script is only mounted into a container made after
    # it was added, and a reset runs in the container the service already has.
    # The same text as mysql's, which passes its own client instead.
    reset:
      exec:
        - sh
        - -c
        - |
          set -e
          database="$1"
          client="$2"
          sql() {
            "$client" --user=root --batch --skip-column-names --database="$database" "$@"
          }
          create="$(sql <<'SQL'
          SELECT CONCAT('CREATE DATABASE `', SCHEMA_NAME, '` CHARACTER SET ', DEFAULT_CHARACTER_SET_NAME, ' COLLATE ', DEFAULT_COLLATION_NAME)
            FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = DATABASE();
          SQL
          )"
          if [ -z "$create" ]; then
            echo "unable to read how the $database database was created" >&2
            exit 1
          fi
          for id in $(sql -e "SELECT ID FROM information_schema.PROCESSLIST WHERE DB = DATABASE() AND ID <> CONNECTION_ID()"); do
            sql -e "KILL $id" >/dev/null 2>&1 || true
          done
          printf '%s\n' \
            "SET SESSION lock_wait_timeout = 60;" \
            "DROP DATABASE \`$database\`;" \
            "$create;" | sql
        - dokku-mariadb-reset
        - "{{ .Database }}"
        - dokku-mariadb-client
      env:
        MYSQL_PWD: "{{ .Secret.root_password }}"

  # the databases the server keeps for itself. A service named after one would
  # hand its app the server's own database rather than one of its own
  reserved_names: [information_schema, mysql, performance_schema, sys]
